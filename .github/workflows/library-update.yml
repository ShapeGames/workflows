name: Check for library template updates

on:
  workflow_call:
    inputs:
      script:
        required: true
        type: string
      branch:
        required: true
        type: string
      title:
        required: true
        type: string
    secrets:
      write_github_token:
        required: true
      git_username:
        required: true
      git_email:
        required: true

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.write_github_token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: 18
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pnpm-

      - name: Install packages
        run: pnpm install --frozen-lockfile

      - name: Configure git
        uses: xiplias/github-git-config-action@v1
        with:
          user.name: ${{ secrets.git_username }}
          user.email: ${{ secrets.git_email }}
          github-token: ${{ secrets.write_github_token }}

      - name: run script
        run: pnpm run ${{ inputs.script }}

      - name: PNPM update lock
        run: pnpm install --no-frozen-lockfile

      - name: remove git config
        run: |
          git config --global --unset-all http.https://github.com/.extraHeader "^AUTHORIZATION: basic"

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.write_github_token }}
          commit-message: ${{ inputs.title }}
          title: ${{ inputs.title }}
          branch: ${{ inputs.branch }}
          base: 'main'
          delete-branch: true
