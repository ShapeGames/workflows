on:
  workflow_call:
    secrets:
      gh_packages_token:
        required: true
      turbo_token:
        required: false
      turbo_team:
        required: false
    inputs:
      node-version:
        type: string
        default: '20'
      node-versions:
        description: Optional JSON array of Node.js versions; otherwise use node-version
        type: string
        default: ''
jobs:
  build_packages:
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON(inputs.node-versions || format('["{0}"]', inputs.node-version)) }}
    timeout-minutes: 10
    name: ${{ inputs.node-versions && format('Build npm package (Node {0})', matrix.node-version) || 'Build npm package' }}
    runs-on: 'ubuntu-latest'
    env:
      # Matrix checks must execute on each runtime rather than replay another Node version.
      TURBO_TOKEN: ${{ inputs.node-versions == '' && secrets.turbo_token || '' }}
      TURBO_TEAM: ${{ inputs.node-versions == '' && secrets.turbo_team || '' }}
      GH_PACKAGES_TOKEN: ${{ secrets.gh_packages_token }}
      NPM_TOKEN: ${{ secrets.gh_packages_token }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package build
        run: pnpm run build
  test:
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON(inputs.node-versions || format('["{0}"]', inputs.node-version)) }}
    timeout-minutes: 10
    name: ${{ inputs.node-versions && format('Lint and Test (Node {0})', matrix.node-version) || 'Lint and Test' }}
    runs-on: 'ubuntu-latest'
    env:
      # Matrix checks must execute on each runtime rather than replay another Node version.
      TURBO_TOKEN: ${{ inputs.node-versions == '' && secrets.turbo_token || '' }}
      TURBO_TEAM: ${{ inputs.node-versions == '' && secrets.turbo_team || '' }}
      GH_PACKAGES_TOKEN: ${{ secrets.gh_packages_token }}
      NPM_TOKEN: ${{ secrets.gh_packages_token }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint
        continue-on-error: true

      - name: Merge lint reports
        run: jq -s '[.[]]|flatten' eslint-reports/*.json &> eslint-reports/eslint_report.json
        continue-on-error: true

      - name: Annotate Code Linting Results
        uses: ataylorme/eslint-annotate-action@1.2.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          report-json: './eslint-reports/eslint_report.json'
        continue-on-error: true

      - name: Upload ESLint report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.node-versions && format('eslint-reports-node-{0}', matrix.node-version) || 'eslint-reports' }}
          path: eslint-reports
          overwrite: true
        continue-on-error: true

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test
