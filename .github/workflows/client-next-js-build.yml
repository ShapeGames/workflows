on:
  workflow_call:
    secrets:
      HOST_ENV:
        required: false
      RELATIVE_CI_KEY:
        required: false
    inputs:
      node_version:
        type: string
        default: 20
jobs:
  lockfile-guard:
    uses: ShapeGames/workflows/.github/workflows/lockfile-guard.yml@main
    with:
      manager: yarn
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HOST_ENV: ${{ secrets.HOST_ENV }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
      - uses: ShapeGames/npm-install@v1.8.34
      - uses: actions/cache@v3
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/yarn.lock') }}
      - name: yarn build
        run: yarn build
        env:
          RELATIVE_CI_KEY: ${{ secrets.RELATIVE_CI_KEY }}
      - run: yarn test
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HOST_ENV: ${{ secrets.HOST_ENV }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
      - uses: ShapeGames/npm-install@v1.8.34
      - name: type-check
        run: yarn tsc-check
      - name: eslint
        if: ${{ !cancelled() }}
        run: yarn eslint-check
      - name: stylelint
        if: ${{ !cancelled() }}
        run: yarn stylelint-check
